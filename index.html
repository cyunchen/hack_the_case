<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halvian ED · Flu-Season Staffing Planner (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F8F7}
a{color:#2D6A55}a:hover{color:#1F4D3D}
button,select,input{font-family:inherit}
button{cursor:pointer}
.ai-chip{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;letter-spacing:.04em;color:#1F4D3D;background:#DCEBE3;border:1px solid #9CC5B2;border-radius:999px;padding:1px 7px 1px 5px;margin-left:6px;vertical-align:middle}
.rule-chip{display:inline-flex;align-items:center;font-size:10px;font-weight:700;letter-spacing:.04em;color:#4A5A60;background:#EEF1F0;border:1px solid #C9D3CF;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.tipwrap summary{list-style:none}.tipwrap summary::-webkit-details-marker{display:none}
.info{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid #94A3B8;background:#FFFFFF;color:#4A5A60;font-size:10px;font-weight:600;padding:0;margin-left:5px;vertical-align:middle;cursor:help}
</style>
<script src="https://cdn.jsdelivr.net/npm/morphdom@2/dist/morphdom-umd.min.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="font-family: Inter, system-ui, sans-serif; color: #1C2A30; background: #F6F8F7; min-height: 100vh; font-size: 14px">

<header style="background: #FFFFFF; border-bottom: 1px solid #DCE3E0">
<div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 32px; height: 32px; border-radius: 4px; background: #2D6A55; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg>
</div>
<div>
<div style="font-weight: 600; font-size: 15px">Halvian ED · Staffing planner</div>
<div style="font-size: 12px; color: #4A5A60; display: flex; gap: 8px; align-items: center; flex-wrap: wrap">Planned on Sep 1, 2026<span style="font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #FEF3C7; color: #92400E; font-weight: 500">Synthetic data for demonstration</span></div>
</div>
</div>
<nav style="display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap" aria-label="Sections">
<template data-for="tabs" data-as="t">
<span style="display: inline-flex; align-items: center; gap: 4px">
<button onClick="{{t.go}}" aria-current="{{t.current}}" style="{{t.style}}"><span style="{{t.numStyle}}">{{t.num}}</span>{{t.label}}</button>
<template data-if="t.arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></template>
</span>
</template>
</nav>
<div style="display: flex; align-items: center; gap: 8px; padding-left: 12px; border-left: 1px solid #DCE3E0">
<div style="width: 30px; height: 30px; border-radius: 50%; background: #DCEBE3; color: #1F4D3D; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">NM</div>
<div style="font-size: 12px; color: #4A5A60">Nurse manager</div>
</div>
</div>
</header>

<div style="background: #ECF4F0; border-bottom: 1px solid #C9D6D0">
<div style="max-width: 1200px; margin: 0 auto; padding: 10px 24px; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: #1F4D3D; flex-wrap: wrap">
<svg width="18" height="18" viewBox="0 0 24 24" fill="#2D6A55" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"></path></svg>
<div style="flex: 1 1 520px; min-width: 0">
<strong>AI assists:</strong> Items marked <span class="ai-chip"><svg width="12" height="12" viewBox="0 0 24 24" fill="#2D6A55" aria-hidden="true"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"></path></svg><span>AI</span></span> are generated by AI and can be wrong.
<details style="margin-top: 6px">
<summary style="cursor: pointer; font-weight: 600; color: #2D6A55">How this AI works</summary>
<div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px"><div style="flex: 1 1 150px; min-width: 140px; background: #FFFFFF; border: 1px solid #C9D6D0; border-radius: 6px; padding: 10px 12px"><div style="font-size: 13px; font-weight: 700; color: #1C2A30; display: flex; align-items: center; flex-wrap: wrap; gap: 2px">1. Data</div><div style="font-size: 12px; color: #4A5A60; margin-top: 3px; line-height: 1.4">Arrival counts, RN schedule, public signals</div></div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A9A8C" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><path d="M5 12h14M13 6l6 6-6 6"></path></svg><div style="flex: 1 1 150px; min-width: 140px; background: #FFFFFF; border: 1px solid #C9D6D0; border-radius: 6px; padding: 10px 12px"><div style="font-size: 13px; font-weight: 700; color: #1C2A30; display: flex; align-items: center; flex-wrap: wrap; gap: 2px">2. Forecast<span class="ai-chip"><svg width="12" height="12" viewBox="0 0 24 24" fill="#2D6A55" aria-hidden="true"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"></path></svg>AI</span></div><div style="font-size: 12px; color: #4A5A60; margin-top: 3px; line-height: 1.4">Patients per shift, with a range</div></div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A9A8C" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><path d="M5 12h14M13 6l6 6-6 6"></path></svg><div style="flex: 1 1 150px; min-width: 140px; background: #FFFFFF; border: 1px solid #C9D6D0; border-radius: 6px; padding: 10px 12px"><div style="font-size: 13px; font-weight: 700; color: #1C2A30; display: flex; align-items: center; flex-wrap: wrap; gap: 2px">3. Recommend<span class="ai-chip"><svg width="12" height="12" viewBox="0 0 24 24" fill="#2D6A55" aria-hidden="true"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"></path></svg>AI</span></div><div style="font-size: 12px; color: #4A5A60; margin-top: 3px; line-height: 1.4">RN plan and summary, using fixed nurse ratios and safe minimums</div></div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A9A8C" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><path d="M5 12h14M13 6l6 6-6 6"></path></svg><div style="flex: 1 1 150px; min-width: 140px; background: #FFFFFF; border: 1px solid #C9D6D0; border-radius: 6px; padding: 10px 12px"><div style="font-size: 13px; font-weight: 700; color: #1C2A30; display: flex; align-items: center; flex-wrap: wrap; gap: 2px">4. Decide<span class="rule-chip">You</span></div><div style="font-size: 12px; color: #4A5A60; margin-top: 3px; line-height: 1.4">Accept or override with a reason</div></div></div><div style="font-size: 12px; color: #4A5A60; margin-top: 8px">Actual arrivals and your overrides feed back to improve the forecast.</div><div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: #1C2A30"><span><strong>Never used:</strong> patient records or individuals' insurance</span><span><strong>Accuracy:</strong> 8% error vs. 15% for last year's average (synthetic backtest)</span><span><strong>Model:</strong> v0.3 · updated Sep 1, 2026 · owner: ED nursing director</span></div>
</details>
</div>
</div>
</div>

<main style="max-width: 1200px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 20px">

<template data-if="isForecast">
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div>
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #2D6A55; margin-bottom: 4px">Step 1 · Forecast</div>
<h1 style="margin: 0; font-size: 26px; font-weight: 700">Patient forecast</h1>
<p style="margin: 4px 0 0; color: #4A5A60; display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A5A60" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 11h18"></path></svg>
{{rangeText}} · {{granUnit}} arrivals</p>
</div>
<div style="display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; position: relative">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #4A5A60">Start date</span>
<button type="button" onClick="{{openStart}}" aria-haspopup="dialog" style="{{startBtnStyle}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A5A60" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 11h18"></path></svg>{{startLabel}}</button>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #4A5A60">End date</span>
<button type="button" onClick="{{openEnd}}" aria-haspopup="dialog" style="{{endBtnStyle}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A5A60" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 11h18"></path></svg>{{endLabel}}</button>
</div>
<template data-if="calOpenF">
<div role="dialog" aria-label="{{cal.title}}" style="position: absolute; z-index: 5; top: 100%; left: 0; margin-top: 8px; width: 300px; background: #FFFFFF; border: 1px solid #C9D3CF; border-radius: 6px; padding: 14px; box-shadow: 0 12px 32px rgba(15,23,42,0.16)">
<div style="font-size: 12px; color: #4A5A60; margin-bottom: 8px">{{cal.title}}</div>
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px">
<button type="button" onClick="{{cal.prev}}" aria-label="Previous month" style="width: 32px; height: 32px; border: 1px solid #DCE3E0; border-radius: 4px; background: #FFFFFF; font-size: 16px">‹</button>
<span style="font-weight: 600">{{cal.month}}</span>
<button type="button" onClick="{{cal.next}}" aria-label="Next month" style="width: 32px; height: 32px; border: 1px solid #DCE3E0; border-radius: 4px; background: #FFFFFF; font-size: 16px">›</button>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; font-size: 11px; color: #64748B; margin-bottom: 4px">
<span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
<template data-for="cal.cells" data-as="c">
<button type="button" onClick="{{c.pick}}" disabled="{{c.disabled}}" aria-label="{{c.aria}}" style="{{c.style}}">{{c.label}}</button>
</template>
</div>
<div style="display: flex; gap: 14px; align-items: center; margin-top: 10px; font-size: 11px; color: #4A5A60; flex-wrap: wrap">
<span style="display: flex; align-items: center; gap: 4px"><span style="font-weight: 600; color: #1C2A30">15</span>Available</span>
<span style="display: flex; align-items: center; gap: 4px"><span style="color: #C9D3CF; text-decoration: line-through">15</span>Not available</span>
<span style="display: flex; align-items: center; gap: 4px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #2D6A55"></span>Selected</span>
</div>
<div style="font-size: 11px; color: #64748B; margin-top: 6px">{{cal.note}}</div>
<div style="display: flex; justify-content: flex-end; margin-top: 8px">
<button type="button" onClick="{{cal.close}}" style="border: 1px solid #C9D3CF; background: #FFFFFF; border-radius: 4px; padding: 6px 12px; font-size: 13px">Close</button>
</div>
</div>
</template>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #4A5A60">View by</span>
<div style="display: flex; background: #DCE3E0; border-radius: 4px; padding: 3px; gap: 2px">
<template data-for="grans" data-as="g">
<button onClick="{{g.pick}}" style="{{g.style}}">{{g.label}}</button>
</template>
</div>
</div>
</div>
</div>

<template data-if="lowConf">
<div role="status" style="display: flex; gap: 12px; align-items: flex-start; background: #FFF7ED; border: 1px solid #FDBA74; border-radius: 6px; padding: 14px 16px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A3412" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
<div><div style="font-weight: 600; color: #7C2D12">Low forecast confidence (range ±{{confPct}})</div><div style="font-size: 13px; color: #7C2D12; margin-top: 2px">The range is too wide to recommend RN counts. Staffing will hide them, and the nurse manager uses the existing scheduling process until confidence improves.</div></div>
</div>
</template>

<div style="display: flex; gap: 12px; align-items: flex-start; background: #FFFFFF; border: 1.5px solid #2D6A55; border-radius: 6px; padding: 14px 16px"><svg width="20" height="20" viewBox="0 0 24 24" fill="#2D6A55" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"></path></svg><div><div style="font-size: 12px; font-weight: 700; color: #2D6A55; letter-spacing: .04em">AI SUMMARY</div><div style="font-size: 15px; line-height: 1.55; color: #1C2A30; margin-top: 4px">{{fcSummary}}</div><div style="font-size: 11px; color: #4A5A60; margin-top: 6px">Written in plain language from the numbers on this page. Check it against the details before acting.</div></div></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px">
<div style="background: #FFFFFF; border: 1px solid #DCE3E0; border-radius: 6px; padding: 16px">
<div style="font-size: 12px; color: #4A5A60">Peak arrivals per day<details class="tipwrap" style="position: relative; display: inline-block; vertical-align: middle"><summary class="info" aria-label="About peak arrivals per day" title="Highest forecast arrivals per day in the selected date range, at the selected view (day, week or month average).">i</summary><span role="tooltip" style="position: absolute; z-index: 10; top: 22px; left: -8px; width: 240px; background: #1C2A30; color: #FFFFFF; font-size: 12px; font-weight: 400; line-height: 1.5; padding: 8px 10px; border-radius: 4px; text-align: left; white-space: normal; box-shadow: 0 8px 20px rgba(15,23,42,0.2)">Highest forecast arrivals per day in the selected date range, at the selected view (day, week or month average).</span></details></div>
<div style="font-size: 26px; font-weight: 600; margin-top: 4px">{{peakFc}}</div>
<div style="font-size: 12px; color: #9A3412; margin-top: 2px">Peaks {{peakWeek}} · last season peaked {{lyPeakWeek}}</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #DCE3E0; border-radius: 6px; padding: 16px">
<div style="font-size: 12px; color: #4A5A60">Extra patients vs. last season<details class="tipwrap" style="position: relative; display: inline-block; vertical-align: middle"><summary class="info" aria-label="About extra patients" title="Forecast minus last season's arrivals, added up over the selected date range.">i</summary><span role="tooltip" style="position: absolute; z-index: 10; top: 22px; left: -8px; width: 240px; background: #1C2A30; color: #FFFFFF; font-size: 12px; font-weight: 400; line-height: 1.5; padding: 8px 10px; border-radius: 4px; text-align: left; white-space: normal; box-shadow: 0 8px 20px rgba(15,23,42,0.2)">Forecast minus last season's arrivals, added up over the selected date range.</span></details></div>
<div style="font-size: 26px; font-weight: 600; margin-top: 4px">{{extraPatients}}</div>
<div style="font-size: 12px; color: #4A5A60; margin-top: 2px">In the selected range</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #DCE3E0; border-radius: 6px; padding: 16px">
<div style="font-size: 12px; color: #4A5A60">AI confidence<span class="ai-chip"><svg width="12" height="12" viewBox="0 0 24 24" fill="#2D6A55" aria-hidden="true"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"></path></svg>AI</span><details class="tipwrap" style="position: relative; display: inline-block; vertical-align: middle"><summary class="info" aria-label="About forecast confidence" title="How narrow the forecast range is. Turning off early signals widens the range and lowers confidence.">i</summary><span role="tooltip" style="position: absolute; z-index: 10; top: 22px; left: -8px; width: 240px; background: #1C2A30; color: #FFFFFF; font-size: 12px; font-weight: 400; line-height: 1.5; padding: 8px 10px; border-radius: 4px; text-align: left; white-space: normal; box-shadow: 0 8px 20px rgba(15,23,42,0.2)">How narrow the forecast range is. Turning off early signals widens the range and lowers confidence.</span></details></div>
<div style="font-size: 26px; font-weight: 600; margin-top: 4px; {{confColor}}">{{confLabel}}</div>
<div style="font-size: 12px; color: #4A5A60; margin-top: 2px">Range ±{{confPct}}</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #DCE3E0; border-radius: 6px; padding: 16px">
<div style="font-size: 12px; color: #4A5A60">Forecast error (backtest)<details class="tipwrap" style="position: relative; display: inline-block; vertical-align: middle"><summary class="info" aria-label="About forecast error" title="Average % difference between forecast and actual arrivals on held-out synthetic weeks, compared with using last year's average.">i</summary><span role="tooltip" style="position: absolute; z-index: 10; top: 22px; left: -8px; width: 240px; background: #1C2A30; color: #FFFFFF; font-size: 12px; font-weight: 400; line-height: 1.5; padding: 8px 10px; border-radius: 4px; text-align: left; white-space: normal; box-shadow: 0 8px 20px rgba(15,23,42,0.2)">Average % difference between forecast and actual arrivals on held-out synthetic weeks, compared with using last year's average.</span></details></div>
<div style="font-size: 26px; font-weight: 600; margin-top: 4px">8%</div>
<div style="font-size: 12px; color: #4A5A60; margin-top: 2px">vs. 15% for last year's average</div>
</div>
</div>

<section aria-label="Forecast compared with last season" style="background: #FFFFFF; border: 1px solid #DCE3E0; border-radius: 6px; padding: 16px 20px">
<h2 style="margin: 0 0 4px; font-size: 15px; font-weight: 600">Compared with last season<span class="ai-chip"><svg width="12" height="12" viewBox="0 0 24 24" fill="#2D6A55" aria-hidden="true"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"></path></svg>AI</span></h2>
<div style="font-size: 12px; color: #4A5A60; margin-bottom: 12px">Days in the selected range where the forecast is at least 5% above or below last season's arrivals on the same date.</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<div style="background: #FFFFFF; border: 1px solid #DCE3E0; border-left: 4px solid #C2410C; border-radius: 6px; padding: 14px 16px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #4A5A60"><span style="width: 10px; height: 10px; border-radius: 50%; background: #C2410C"></span>Above last season</div>
<div style="display: flex; align-items: baseline; gap: 6px; margin-top: 4px"><span style="font-size: 26px; font-weight: 600">{{cmp.above.n}}</span><span style="font-size: 13px; color: #4A5A60">of {{cmp.days}} days</span></div>
<template data-if="cmp.above.has"><div style="font-size: 12px; line-height: 1.6; color: #34444A; margin-top: 4px"><div>{{cmp.above.span}}</div><div>Average {{cmp.above.avg}}</div><div style="font-weight: 600; color: #9A3412">Biggest: {{cmp.above.big}}</div><div style="color: #9A3412">Flu arriving earlier: plan extra nurses</div></div></template>
<template data-if="cmp.above.none"><div style="font-size: 12px; color: #4A5A60; margin-top: 4px">None in the selected range</div></template>
</div>
<div style="background: #FFFFFF; border: 1px solid #DCE3E0; border-left: 4px solid #0369A1; border-radius: 6px; padding: 14px 16px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #4A5A60"><span style="width: 9px; height: 9px; background: #0369A1; transform: rotate(45deg)"></span>Below last season</div>
<div style="display: flex; align-items: baseline; gap: 6px; margin-top: 4px"><span style="font-size: 26px; font-weight: 600">{{cmp.below.n}}</span><span style="font-size: 13px; color: #4A5A60">of {{cmp.days}} days</span></div>
<template data-if="cmp.below.has"><div style="font-size: 12px; line-height: 1.6; color: #34444A; margin-top: 4px"><div>{{cmp.below.span}}</div><div>Average {{cmp.below.avg}}</div><div style="font-weight: 600; color: #0B5A7A">Biggest: {{cmp.below.big}}</div><div style="color: #0B5A7A">No RSV bump this year: avoid overstaffing</div></div></template>
<template data-if="cmp.below.none"><div style="font-size: 12px; color: #4A5A60; margin-top: 4px">None in the selected range</div></template>
</div>
<div style="background: #FFFFFF; border: 1px solid #DCE3E0; border-left: 4px solid #94A3B8; border-radius: 6px; padding: 14px 16px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #4A5A60"><span style="width: 10px; height: 3px; background: #94A3B8"></span>Similar to last season</div>

      openStart: function () { var d = parse(st.start); self.setState({ cal: st.cal === 'start' ? '' : 'start', calM: d.getFullYear() * 12 + d.getMonth() }); },
      openEnd: function () { var d = parse(st.end); self.setState({ cal: st.cal === 'end' ? '' : 'end', calM: d.getFullYear() * 12 + d.getMonth() }); },
      calOpenF: st.cal === 'start' || st.cal === 'end', calOpenS: st.cal === 'sstart' || st.cal === 'send', cal: calView,
      sStartLabel: self.fmt(parse(st.sStart), false) + ', ' + parse(st.sStart).getFullYear(),
      sEndLabel: self.fmt(parse(st.sEnd), false) + ', ' + parse(st.sEnd).getFullYear(),
      sStartBtnStyle: btnStyle(st.cal === 'sstart'), sEndBtnStyle: btnStyle(st.cal === 'send'),
      openSStart: function () { var d = parse(st.sStart); self.setState({ cal: st.cal === 'sstart' ? '' : 'sstart', calM: d.getFullYear() * 12 + d.getMonth() }); },
      openSEnd: function () { var d = parse(st.sEnd); self.setState({ cal: st.cal === 'send' ? '' : 'send', calM: d.getFullYear() * 12 + d.getMonth() }); },
      cmp: cmp, markers: markers, zones: zones, tip: tip, hasHover: hk >= 0, clearHover: function () { self.setState({ hov: -1 }); },
      peakWeek: pts[fcPeak] ? pts[fcPeak].label : '—', lyPeakWeek: pts[lyPeak] ? pts[lyPeak].label : '—',
      peakFc: peakFc, peakRange: Math.round(peakFc * (1 - width)) + '–' + Math.round(peakFc * (1 + width)),
      extraPatients: Math.round(extra).toLocaleString(), sevPct: signed(m.sev * avgS), rangeShort: self.fmt(days[a0].dt, false) + ' – ' + self.fmt(days[a1].dt, false),
      confLabel: confLabel, confColor: confColor, confPct: Math.round(width * 100) + '%', lowConf: confLabel === 'Low',
      weekRange: weekRange,
      views: views, viewShift: st.view === 'shift', viewSummary: st.view !== 'shift', summaryRows: summaryRows, summaryHead: st.view === 'week' ? 'Week' : 'Day',
      acceptStyle: 'border: none; border-radius: 4px; padding: 9px 16px; font-weight: 500; font-size: 14px; ' + (confLabel === 'Low' ? 'background: #DCE3E0; color: #64748B; cursor: not-allowed' : 'background: #2D6A55; color: #FFFFFF'),
      hasBelow: belowCount > 0, noBelow: belowCount === 0, belowCount: belowCount,
      statusStyle: 'display: flex; gap: 10px; align-items: center; min-height: 22px; border-radius: 6px; padding: 10px 14px; font-size: 13px; border: 1px solid ' + (belowCount > 0 ? '#FDBA74; background: #FFF7ED; color: #7C2D12' : '#86EFAC; background: #F0FDF4; color: #14532D'),
      rows: rows, reason: st.reason, showError: st.showError, stop: function (e) { if (e && e.stopPropagation) e.stopPropagation(); },
      hasToast: !!st.toast, toast: st.toast, dismissToast: function () { self.setState({ toast: '' }); },
      regAdded: st.reg, regNotAdded: !st.reg,
      regShifts: m.nDays * 2, regCost: money(m.nDays * 2 * 8 * 35),
      addReg: function () { self.setState({ reg: true, toast: 'Equity support staff added · ' + (m.nDays * 2) + ' shifts', log: st.log.concat([{ shift: 'Evening and night shifts', action: 'Added equity support staff', reason: 'High uninsured share on these shifts', time: 'Sep 1, ' + self.stamp() }]) }); },
      onReason: function (e) { self.setState({ reason: e.target.value, showError: false }); },
      acceptAll: function () {
        if (confLabel === 'Low') return;
        var plans = Object.assign({}, st.plans);
        var saved = Object.assign({}, st.saved);
        m.rows.forEach(function (r) { plans[r.key] = Math.max(r.min, r.need); saved[r.key] = plans[r.key]; });
        var changed = m.rows.filter(function (r) { return r.plan !== Math.max(r.min, r.need); }).length;
        var entry = { shift: weekRange, action: 'Accepted recommended plan', reason: '—', time: 'Sep 1, ' + self.stamp() };
        self.setState({ plans: plans, saved: saved, log: st.log.concat([entry]), toast: 'Plan saved · ' + changed + ' shifts updated' });
      },
      goStaffing: function () { self.setState({ tab: 'staffing' }); },
      goFinance: function () { self.setState({ tab: 'finance' }); },
      kpi: kpi, fcSummary: fcSummary, staffSummary: staffSummary,
      fin: fin, eq: eq, log: st.log, noLog: st.log.length === 0
    };
  }
}

bootDC(Component);
</script>
</body>
</html>
